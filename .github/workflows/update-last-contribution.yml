name: Update last contribution date

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/update-last-contribution.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read contribution calendar and update README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const query = `query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    weeks {
                      contributionDays { date contributionCount }
                    }
                  }
                }
              }
            }`;
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                'content-type': 'application/json',
                'user-agent': 'arwin-profile-readme',
              },
              body: JSON.stringify({ query, variables: { login: 'Arwin-K' } }),
            });
            if (!response.ok) throw new Error(`GitHub GraphQL returned ${response.status}`);
            const payload = await response.json();
            if (payload.errors?.length) throw new Error(JSON.stringify(payload.errors));

            const weeks = payload.data?.user?.contributionsCollection?.contributionCalendar?.weeks;
            if (!Array.isArray(weeks)) throw new Error('Contribution calendar was unavailable');
            const latest = weeks.flatMap(week => week.contributionDays)
              .filter(day => day.contributionCount > 0)
              .map(day => day.date)
              .sort()
              .at(-1);
            if (!latest) throw new Error('No contribution day was found');

            const path = 'README.md';
            const readme = fs.readFileSync(path, 'utf8');
            const pattern = /^Last login: \d{4}-\d{2}-\d{2}$/m;
            if (!pattern.test(readme)) throw new Error('Last login line was not found');
            const updated = readme.replace(pattern, `Last login: ${latest}`);
            if (updated !== readme) fs.writeFileSync(path, updated);
            console.log(`Latest contribution day: ${latest}`);
          }

          main().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Commit changed date
        run: |
          if git diff --quiet -- README.md; then
            echo "Last contribution date is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update profile last contribution date"
          git push
